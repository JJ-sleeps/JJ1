[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"

[workspace.dependencies]
jj1-net = { path = "crates/jj1-net" }
jj1-distill = { path = "crates/jj1-distill" }
jj1-core = { path = "crates/jj1-core" }
jj1-mcp = { path = "crates/jj1-mcp" }

url = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
scraper = "0.22"
encoding_rs = "0.8"
clap = { version = "4", features = ["derive"] }
reqwest = { version = "0.12", default-features = false, features = [
    "blocking", "rustls-tls", "http2", "gzip", "brotli", "deflate", "cookies",
] }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
panic = "abort"
