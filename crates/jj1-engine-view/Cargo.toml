[package]
name = "jj1-engine-view"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Tier 2: the system WebView (WebView2 / WKWebView / WebKitGTK) behind JJ1"

# The worker process `jj1` starts on demand for pages that need JavaScript.
[[bin]]
name = "jj1-view"
path = "src/bin/view.rs"

# The browser a person uses: window, tabs, address bar.
[[bin]]
name = "jj1-browser"
path = "src/bin/browser.rs"

# Stand-alone measurement probe used by bench/bench-js.ps1.
[[bin]]
name = "jj1-view-probe"
path = "src/bin/probe.rs"

[dependencies]
wry = "0.57"
tao = "0.37"
serde_json.workspace = true
url.workspace = true
jj1-net.workspace = true
jj1-distill.workspace = true
reqwest = { workspace = true, features = ["json"] }
base64 = "0.22"

[target.'cfg(windows)'.dependencies]
webview2-com = "0.39"
windows = { version = "0.62", features = [
    "Win32_Graphics_Gdi",
    "Win32_Graphics_Dwm",
    "Win32_UI_WindowsAndMessaging",
    "Win32_Foundation",
    "Win32_Storage_Xps",
    "Win32_System_Com",
    "Win32_System_SystemInformation",
    "Win32_UI_Input_KeyboardAndMouse",
] }
window-vibrancy = "0.6"
png = "0.17"
